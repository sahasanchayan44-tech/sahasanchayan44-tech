name: Daily GitHub Telemetry Synchronization

'on':
  schedule:
    # Run once every day at 02:17 UTC (avoiding top-of-hour load spikes)
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force snapshot write even if substantive data is unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  group: github-telemetry-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-telemetry:
    name: Ingest and Validate GitHub Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Execute Telemetry Collector & Schema Validator
        id: collector
        run: |
          echo "================================================================"
          echo "=== RUNNING BLUEPRINT GITHUB TELEMETRY SYNCHRONIZATION ==="
          echo "================================================================"
          echo "Trigger event: ${{ github.event_name }}"
          echo "Execution timestamp (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "[MODE] Forced update enabled via manual workflow_dispatch."
            node scripts/fetch-public-github-data.js
          else
            echo "[MODE] Standard synchronization with substantive change detection."
            node scripts/fetch-public-github-data.js --only-if-changed
          fi

      - name: Check for Telemetry Modifications
        id: git_diff
        run: |
          if git diff --quiet docs/data/github-data.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ TELEMETRY STATUS: No substantive changes detected. Current snapshot is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ TELEMETRY STATUS: Substantive changes detected. Snapshot updated."
            git status --short docs/data/github-data.json
          fi

      - name: Check GitHub App Credentials
        id: app_creds_check
        if: steps.git_diff.outputs.has_changes == 'true'
        env:
          APP_ID: ${{ secrets.TELEMETRY_APP_ID }}
          APP_KEY: ${{ secrets.TELEMETRY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "has_app_creds=true" >> $GITHUB_OUTPUT
            echo "✓ AUTHENTICATION: GitHub App secrets detected."
          else
            echo "has_app_creds=false" >> $GITHUB_OUTPUT
            echo "::warning title=Telemetry Automation Safeguard::GitHub App secrets (TELEMETRY_APP_ID / TELEMETRY_APP_PRIVATE_KEY) not configured."
            echo "Telemetry data was collected and validated against Draft-07 schema successfully."
            echo "Automated PR creation is safely held pending GitHub App setup. See GITHUB_APP_SETUP_GUIDE.md."
          fi

      - name: Generate GitHub App Token
        id: app_token
        if: steps.git_diff.outputs.has_changes == 'true' && steps.app_creds_check.outputs.has_app_creds == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TELEMETRY_APP_ID }}
          private-key: ${{ secrets.TELEMETRY_APP_PRIVATE_KEY }}

      - name: Create or Update Telemetry Pull Request
        if: steps.git_diff.outputs.has_changes == 'true' && steps.app_creds_check.outputs.has_app_creds == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          echo "================================================================"
          echo "=== CREATING/UPDATING AUTOMATED TELEMETRY PULL REQUEST ==="
          echo "================================================================"

          BRANCH="automation/telemetry-sync"
          git config user.name "blueprint-telemetry[bot]"
          git config user.email "268472249+sahasanchayan44-tech@users.noreply.github.com"

          # Rebase automation branch from main
          git checkout -B "$BRANCH" origin/main
          git add docs/data/github-data.json
          git commit -m "chore(telemetry): daily GitHub data synchronization"

          # Push to automation branch using App token
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH" --force
          echo "✓ Pushed telemetry commit to $BRANCH"

          # Check for existing PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            echo "Opening new telemetry PR..."
            PR_BODY="### Automated GitHub Telemetry Synchronization\n\nThis pull request was automatically generated by Daily GitHub Telemetry Synchronization.\n\n#### Verification Checklist\n- [x] Public telemetry collected and validated against Draft-07 schema\n- [x] Substantive change detection confirmed data updates\n- [x] Zero personal email addresses detected\n- [x] Automated merge will engage upon passing all 4 required CI checks:\n  - Codebase & Document Validation\n  - Accessibility & Usability Audit\n  - Security & Credential Hygiene\n  - Regression & Browser Test Suites"
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(telemetry): daily GitHub data synchronization" \
              --body "$PR_BODY")
            echo "✓ Created PR: $PR_URL"
          else
            echo "✓ Updated existing open PR #$EXISTING_PR"
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "Attempting to enable auto-merge for PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || echo "::notice title=Auto-Merge Note::Auto-merge could not be enabled automatically. Ensure 'Allow auto-merge' is enabled in repository settings."
          fi
